project_id = "fusion-engine-live"

[auth]
site_url = "https://gonovi.app"
additional_redirect_urls = [
  "https://gonovi.app/**",
  "https://fusion-engine-live-*.vercel.app/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "no-reply@gonovi.app"
sender_name = "GONOVI"

[auth.email.template.confirmation]
subject = "{{ .Token }} es tu código de acceso a GONOVI"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.magic_link]
subject = "{{ .Token }} es tu código de acceso a GONOVI"
content_path = "./supabase/templates/magic-link.html"
